name: Release

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Verify builds: no signing, application uploads, or release publication'
        type: boolean
        default: true
      verify_target:
        description: 'Build-only platform selection; actual releases always build all platforms'
        type: choice
        options: [all, linux, windows, macos, android, web, ios]
        default: all
      source_sha:
        description: 'Build-only may use the branch tip; a full release requires the SHA approved in ci/approved_release_source.json'
        required: false
        type: string
        default: ''
      version:
        description: 'Release version (major.minor.patch)'
        required: false
        type: string
        default: '0.1.0'
      build_number:
        description: 'Fresh shared app build number (1-9999)'
        required: true
        type: string
      ios_action:
        description: 'Full releases require upload or submit; build-only requires skip'
        type: choice
        options: [skip, upload, submit]
        default: skip
      automatic_release:
        description: 'Release after approval (submit mode only)'
        type: boolean
        default: false
      include_selfhost:
        description: 'Include the distributable deployment kit'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.build_only && format('verify-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve release inputs
    if: github.ref == 'refs/heads/main'
    environment: downloads
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      workflow_id: ${{ steps.resolve.outputs.workflow_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve source revision and defaults
        id: resolve
        run: python3 ci/bootstrap.py
        env:
          RELEASE_TARGET: resolve
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}

  verify:
    name: Verify ${{ matrix.target }} build (${{ needs.resolve.outputs.workflow_id }})
    needs: resolve
    if: github.ref == 'refs/heads/main' && inputs.build_only
    environment: downloads
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: ${{ inputs.verify_target == 'all' && fromJSON('["linux","windows","macos","android","web","ios"]') || fromJSON(format('["{0}"]', inputs.verify_target)) }}
    runs-on: ${{ matrix.target == 'windows' && 'windows-2022' || ((matrix.target == 'macos' || matrix.target == 'ios') && 'macos-26' || 'ubuntu-24.04') }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify public launcher contracts
        run: |
          python -m unittest discover -s ci -p 'test_*.py'
          node --test ci/test_sealed_diagnostics.cjs
      - name: Verify build without publishing
        run: python ci/bootstrap.py
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  validate:
    name: Validate release (${{ needs.resolve.outputs.workflow_id }})
    permissions:
      contents: write
    needs: resolve
    if: github.ref == 'refs/heads/main' && !inputs.build_only
    environment: downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify public launcher contracts
        run: python3 -m unittest discover -s ci -p 'test_*.py'
      - name: Validate reviewed source revision
        run: python3 ci/bootstrap.py
        env:
          RELEASE_TARGET: validate
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-validate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  downloads:
    name: Build ${{ matrix.target }} (${{ needs.resolve.outputs.workflow_id }})
    permissions:
      contents: write
    needs: [resolve, validate]
    if: github.ref == 'refs/heads/main' && !inputs.build_only
    environment: downloads
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - target: linux
            runner: ubuntu-24.04
          - target: windows
            runner: windows-2022
          - target: macos
            runner: macos-26
          - target: android
            runner: ubuntu-24.04
          - target: web
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Execute reviewed release task
        run: python ci/bootstrap.py
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          SIGNING_CONFIG: ${{ matrix.target == 'android' && secrets.SIGNING_CONFIG || '' }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  ios:
    name: iOS delivery (${{ needs.resolve.outputs.workflow_id }})
    permissions:
      contents: write
    needs: [resolve, validate]
    if: github.ref == 'refs/heads/main' && !inputs.build_only && inputs.ios_action != 'skip'
    environment: app-store
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Execute reviewed release task
        run: python3 ci/bootstrap.py
        env:
          RELEASE_TARGET: ios
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-ios-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish release (${{ needs.resolve.outputs.workflow_id }})
    # Wait for every validation-receipt consumer before deleting draft receipts.
    # No partial release: every download and signed Apple delivery must succeed.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.build_only && needs.resolve.result == 'success' && needs.validate.result == 'success' && needs.downloads.result == 'success' && needs.ios.result == 'success' }}
    needs: [resolve, validate, downloads, ios]
    environment: public-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Execute reviewed release task
        run: python3 ci/bootstrap.py
        env:
          RELEASE_TARGET: publish
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-publish-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
