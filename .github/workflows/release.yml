  external_tests:
    name: Actual ${{ matrix.platform }} artifact and provider acceptance
    needs: [resolve, publication_prepare, managed_rtc_provider]
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only
    environment: external-tests
    runs-on: [self-hosted, '${{ matrix.runner }}']
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ matrix.platform == 'linux' && 'omniterm-mcp-candidate-staging' || format('external-tests-{0}', matrix.platform) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: omniterm-release-linux
            config_variable: OMNI_EXTERNAL_CONFIG_LINUX
            candidate_guard_variable: OMNI_EXTERNAL_CANDIDATE_GUARD_CONFIG_LINUX
          - platform: macos
            runner: omniterm-release-macos
            config_variable: OMNI_EXTERNAL_CONFIG_MACOS
            candidate_guard_variable: OMNI_EXTERNAL_CANDIDATE_GUARD_CONFIG_MACOS
          - platform: windows
            runner: omniterm-release-windows
            config_variable: OMNI_EXTERNAL_CONFIG_WINDOWS
            candidate_guard_variable: OMNI_EXTERNAL_CANDIDATE_GUARD_CONFIG_WINDOWS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify genuine Ubuntu archive metadata for Linux external tests
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          grep -Eq '^ID="?ubuntu"?$' /etc/os-release
          keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg
          test -f "$keyring" && test ! -L "$keyring" && test -s "$keyring"
          test "$(dpkg-query -W -f='${Status}' ubuntu-keyring)" = 'install ok installed'
          dpkg-query -S "$keyring" | grep -Eq '^ubuntu-keyring(:[^:]*)?: /usr/share/keyrings/ubuntu-archive-keyring[.]gpg$'
          verify_output="$(dpkg --verify ubuntu-keyring)"
          test -z "$verify_output"
          sudo -n true
          command -v gpg >/dev/null || { echo 'missing gpg required by the protected Ubuntu signature cases' >&2; exit 1; }
          command -v gpgv >/dev/null || { echo 'missing gpgv required for Ubuntu InRelease preflight' >&2; exit 1; }
          sudo apt-get update
          ubuntu_archive_signer=F6ECB3762474EDA9D21B7022871920D1991BC93C
          found_inrelease=0
          for metadata in /var/lib/apt/lists/*_dists_*_InRelease; do
            test -f "$metadata" && test -s "$metadata" || continue
            if signature_status="$(gpgv --status-fd 1 --keyring "$keyring" "$metadata" 2>/dev/null)"; then
              if grep -Eq "^\\[GNUPG:\\] VALIDSIG ${ubuntu_archive_signer} " <<< "$signature_status"; then
                found_inrelease=1
                break
              fi
            fi
          done
          test "$found_inrelease" -eq 1
      - name: Execute exact external cases against real candidate and providers
        run: python ci/bootstrap.py
        env:
          RELEASE_TARGET: external-tests
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          OMNI_EXTERNAL_PLATFORM: ${{ matrix.platform }}
          OMNI_EXTERNAL_CONFIG_FILE: ${{ vars[matrix.config_variable] }}
          OMNI_EXTERNAL_CANDIDATE_GUARD_CONFIG_FILE: ${{ vars[matrix.candidate_guard_variable] }}
          OMNI_MCP_STAGING_DEPLOYMENT_CONFIG_FILE: ${{ matrix.platform == 'linux' && vars.OMNI_MCP_STAGING_DEPLOYMENT_CONFIG_FILE || '' }}
          OMNI_MCP_STAGING_READ_TOKEN: ${{ matrix.platform == 'linux' && secrets.OMNI_MCP_STAGING_READ_TOKEN || '' }}
          OMNI_MCP_STAGING_WRITE_TOKEN: ${{ matrix.platform == 'linux' && secrets.OMNI_MCP_STAGING_WRITE_TOKEN || '' }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          GH_TOKEN: ${{ matrix.platform == 'linux' && secrets.RELEASE_METADATA_READ_TOKEN || github.token }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-external-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  external_windows_signing:
    name: Actual Windows Azure signing acceptance
    needs: [resolve, publication_prepare, external_tests]
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only
    environment: external-windows-signing
    runs-on: [self-hosted, 'omniterm-release-windows']
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Prepare hash-pinned Windows Artifact Signing client and dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $destination = Join-Path $env:RUNNER_TEMP ('external-artifact-signing-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $destination | Out-Null
          $archive = Join-Path $destination 'client.zip'
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.128/microsoft.artifactsigning.client.1.0.128.nupkg' -OutFile $archive -TimeoutSec 120
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne '74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b') { throw 'Artifact Signing client hash mismatch' }
          $package = Join-Path $destination 'package'
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          $libraries = @(Get-ChildItem -LiteralPath $package -Recurse -File -Filter 'Azure.CodeSigning.Dlib.dll' | Where-Object { $_.FullName -match '[\\/](?:x64|win-x64)[\\/]' })
          if ($libraries.Count -ne 1) { throw 'One actual x64 signing library is required' }
          $dlib = $libraries[0].FullName
          if (-not ((dotnet --list-runtimes) -match '^Microsoft\.NETCore\.App 8\.')) { throw '.NET 8 runtime is required' }
          "OMNI_WINDOWS_ARTIFACT_SIGNING_DLIB=$dlib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Execute only the protected Windows Azure signing case
        run: python ci/bootstrap.py
        env:
          RELEASE_TARGET: external-windows-signing
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          OMNI_EXTERNAL_PLATFORM: windows-signing
          OMNI_EXTERNAL_CANDIDATE_GUARD_CONFIG_FILE: ${{ vars.OMNI_EXTERNAL_CANDIDATE_GUARD_CONFIG_FILE }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          SIGNING_CONFIG: ${{ secrets.WINDOWS_SIGNING_CONFIG }}
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted Windows diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-external-windows-signing-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
      - name: Remove temporary Windows signing client
        if: ${{ always() }}
        shell: pwsh
        run: |
          Get-ChildItem -Path $env:RUNNER_TEMP -Directory -Filter 'external-artifact-signing-*' -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction Stop }

  apple_submission:
    name: Submit accepted iOS candidate for public review
    needs: [resolve, validate, ios_delivery, publication_prepare, vpn_container, external_tests, external_windows_signing]
    if: ${{ !cancelled() && github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only && inputs.ios_action == 'submit' && needs.vpn_container.result == 'success' && needs.external_tests.result == 'success' && needs.external_windows_signing.result == 'success' }}
    environment: app-store
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Verify external acceptance before actual Apple submission
        run: python3 ci/bootstrap.py
        env:
          RELEASE_TARGET: ios-submit
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          SIGNING_CONFIG: ${{ secrets.IOS_SIGNING_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted submission diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-apple-submission-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish release (${{ needs.resolve.outputs.workflow_id }})
    # Wait for every validation-receipt consumer before deleting draft receipts.
    # No partial release: real post-build/provider evidence is mandatory too.
    if: ${{ !cancelled() && github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only && needs.resolve.result == 'success' && needs.validate.result == 'success' && needs.downloads.result == 'success' && needs.windows_download.result == 'success' && needs.ios.result == 'success' && needs.package_signatures.result == 'success' && needs.apple_testflight.result == 'success' && needs.installation.result == 'success' && needs.vpn_container.result == 'success' && needs.ios_delivery.result == 'success' && needs.publication_prepare.result == 'success' && needs.managed_rtc_provider.result == 'success' && needs.external_tests.result == 'success' && needs.external_windows_signing.result == 'success' && (inputs.ios_action == 'upload' || needs.apple_submission.result == 'success') }}
    needs: [resolve, validate, downloads, windows_download, ios, package_signatures, apple_testflight, installation, vpn_container, ios_delivery, publication_prepare, managed_rtc_provider, external_tests, external_windows_signing, apple_submission]
    environment: public-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Execute reviewed release task
        run: python3 ci/bootstrap.py
        env:
          RELEASE_TARGET: publish
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-publish-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
