name: Release

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Verify builds: no release publication or production signing; optional self-signed Windows preview'
        type: boolean
        default: true
      verify_target:
        description: 'Build-only platform selection; actual releases always build all platforms'
        type: choice
        options: [all, linux, windows, macos, android, web, ios]
        default: all
      preview_windows_self_sign:
        description: 'Windows build-only: retain a self-signed evaluation ZIP as a short-lived Actions artifact'
        type: boolean
        default: false
      source_sha:
        description: 'Build-only may use the branch tip; a full release requires the SHA approved in ci/approved_release_source.json'
        required: false
        type: string
        default: ''
      version:
        description: 'Release version (major.minor.patch)'
        required: false
        type: string
        default: '0.1.0'
      build_number:
        description: 'Fresh shared app build number (1-9999)'
        required: true
        type: string
      ios_action:
        description: 'Full releases require upload or submit; build-only requires skip'
        type: choice
        options: [skip, upload, submit]
        default: skip
      automatic_release:
        description: 'Release after approval (submit mode only)'
        type: boolean
        default: false
      include_selfhost:
        description: 'Full releases require the kit; only build-only validation may omit it'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.build_only && format('verify-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve release inputs
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main'
    environment: downloads
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      workflow_id: ${{ steps.resolve.outputs.workflow_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve source revision and defaults
        id: resolve
        run: python3 ci/bootstrap.py
        env:
          RELEASE_TARGET: resolve
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}

  integration:
    name: Actual ${{ matrix.platform }} application integration
    needs: resolve
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only
    environment: downloads
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: omniterm-release-linux
            device_variable: OMNI_INTEGRATION_DEVICE_LINUX
            defines_variable: OMNI_INTEGRATION_DEFINES_LINUX
          - platform: macos
            runner: omniterm-release-macos
            device_variable: OMNI_INTEGRATION_DEVICE_MACOS
            defines_variable: OMNI_INTEGRATION_DEFINES_MACOS
          - platform: windows
            runner: omniterm-release-windows
            device_variable: OMNI_INTEGRATION_DEVICE_WINDOWS
            defines_variable: OMNI_INTEGRATION_DEFINES_WINDOWS
          - platform: android
            runner: omniterm-release-android
            device_variable: OMNI_INTEGRATION_DEVICE_ANDROID
            defines_variable: OMNI_INTEGRATION_DEFINES_ANDROID
          - platform: ios
            runner: omniterm-release-ios
            device_variable: OMNI_INTEGRATION_DEVICE_IOS
            defines_variable: OMNI_INTEGRATION_DEFINES_IOS
          - platform: web
            runner: omniterm-release-web
            device_variable: OMNI_INTEGRATION_DEVICE_WEB
            defines_variable: OMNI_INTEGRATION_DEFINES_WEB
    runs-on: [self-hosted, '${{ matrix.runner }}']
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute genuine reviewed application journeys and retain private evidence
        run: python ci/bootstrap.py
        env:
          RELEASE_TARGET: integration
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          OMNI_INTEGRATION_PLATFORM: ${{ matrix.platform }}
          OMNI_INTEGRATION_DEVICE: ${{ vars[matrix.device_variable] }}
          OMNI_INTEGRATION_DEFINES: ${{ vars[matrix.defines_variable] }}
          OMNI_CHROMEDRIVER_PORT: ${{ vars.OMNI_CHROMEDRIVER_PORT }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted integration diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-integration-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  verify:
    name: Verify ${{ matrix.target }} build (${{ needs.resolve.outputs.workflow_id }})
    needs: resolve
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && inputs.build_only
    environment: downloads
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: ${{ inputs.verify_target == 'all' && fromJSON('["linux","windows","macos","android","web","ios"]') || fromJSON(format('["{0}"]', inputs.verify_target)) }}
    runs-on: ${{ matrix.target == 'windows' && 'windows-2022' || ((matrix.target == 'macos' || matrix.target == 'ios') && 'macos-26' || 'ubuntu-24.04') }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17.0.20+101'
      - name: Verify public launcher contracts
        run: |
          python -m unittest discover -s ci -p 'test_*.py'
          node --test ci/test_sealed_diagnostics.cjs
      - name: Verify build without publishing
        run: python ci/bootstrap.py
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
          WINDOWS_PREVIEW_OUTPUT_DIR: ${{ inputs.preview_windows_self_sign && matrix.target == 'windows' && format('{0}/windows-preview', runner.temp) || '' }}
      - name: Retain self-signed Windows evaluation build
        if: ${{ inputs.preview_windows_self_sign && matrix.target == 'windows' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-self-signed-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-preview/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain encrypted diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  validate:
    name: Validate release (${{ needs.resolve.outputs.workflow_id }})
    permissions:
      contents: write
    needs: [resolve, integration]
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only
    environment: downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install native HTTP/3 build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libicu-dev
      - name: Verify public launcher contracts
        run: python3 -m unittest discover -s ci -p 'test_*.py'
      - name: Verify self-hosted relay package locks and suites
        run: |
          npm ci --prefix relay/native
          node --test --test-concurrency=1 ci/test_native_relay_contract.mjs
          npm ci --prefix relay/moq
          npm test --prefix relay/moq
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Validate reviewed source revision
        run: python3 ci/bootstrap.py
        env:
          RELEASE_TARGET: validate
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-validate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  downloads:
    name: Build ${{ matrix.target }} (${{ needs.resolve.outputs.workflow_id }})
    permissions:
      contents: write
    needs: [resolve, validate]
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only
    environment: downloads
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - target: linux
            runner: ubuntu-24.04
          - target: macos
            runner: macos-26
          - target: android
            runner: ubuntu-24.04
          - target: web
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17.0.20+101'
      - name: Execute reviewed release task
        run: python ci/bootstrap.py
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          SIGNING_CONFIG: ${{ matrix.target == 'macos' && secrets.MACOS_SIGNING_CONFIG || matrix.target == 'android' && secrets.ANDROID_SIGNING_CONFIG || '' }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  windows_download:
    name: Build and sign Windows candidate (${{ needs.resolve.outputs.workflow_id }})
    needs: [resolve, validate]
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only
    environment: downloads
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Prepare pinned Windows signing client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          New-Item -ItemType Directory -Path $root | Out-Null
          $archive = Join-Path $root 'client.zip'
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.128/microsoft.artifactsigning.client.1.0.128.nupkg' -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne '74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b') { throw 'Artifact Signing client hash mismatch' }
          $package = Join-Path $root 'package'
          Expand-Archive -LiteralPath $archive -DestinationPath $package
          $dlib = Join-Path $package 'bin/x64/Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path -LiteralPath $dlib -PathType Leaf)) { throw 'Artifact Signing client is incomplete' }
          if (-not ((dotnet --list-runtimes) -match '^Microsoft\.NETCore\.App 8\.')) { throw '.NET 8 runtime is required for Artifact Signing' }
          "OMNI_WINDOWS_ARTIFACT_SIGNING_DLIB=$dlib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Execute reviewed Windows release task
        run: python ci/bootstrap.py
        env:
          RELEASE_TARGET: windows
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          SIGNING_CONFIG: ${{ secrets.WINDOWS_SIGNING_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted Windows build diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-downloads-windows-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
      - name: Remove temporary Windows signing client
        if: ${{ always() }}
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }

  ios:
    name: Build signed iOS candidate (${{ needs.resolve.outputs.workflow_id }})
    permissions:
      contents: write
    needs: [resolve, validate]
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only && inputs.ios_action != 'skip'
    environment: app-store
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Execute reviewed release task
        run: python3 ci/bootstrap.py
        env:
          RELEASE_TARGET: ios
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          SIGNING_CONFIG: ${{ secrets.IOS_SIGNING_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-ios-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  package_signatures:
    name: Sign verified Linux and browser candidate manifests (${{ needs.resolve.outputs.workflow_id }})
    permissions:
      contents: read
    needs: [resolve, validate, downloads, windows_download]
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only
    environment: package-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Execute reviewed release task
        run: python3 ci/bootstrap.py
        env:
          RELEASE_TARGET: package-signatures
          OMNITERM_VPN_PROVIDER_PUBLIC_KEY: ${{ vars.OMNITERM_VPN_PROVIDER_PUBLIC_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST: ${{ toJSON(inputs) }}
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          RESOLVED_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVED_BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_BRANCH: ${{ secrets.SOURCE_BRANCH }}
          SOURCE_ENTRYPOINT: ${{ secrets.SOURCE_ENTRYPOINT }}
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
          SOURCE_KNOWN_HOSTS: ${{ secrets.SOURCE_KNOWN_HOSTS }}
          SOURCE_SUBMODULE_TOKEN: ${{ secrets.SOURCE_SUBMODULE_TOKEN }}
          BUILD_CONFIG: ${{ secrets.BUILD_CONFIG }}
          SIGNING_CONFIG: ${{ secrets.PACKAGE_SIGNING_CONFIG }}
          STORAGE_CONFIG: ${{ secrets.STORAGE_CONFIG }}
          DIAGNOSTICS_PUBLIC_KEY: ${{ secrets.DIAGNOSTICS_PUBLIC_KEY }}
      - name: Retain encrypted diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-package-signatures-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-diagnostics/diagnostics.sealed
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  apple_testflight:
    name: Process exact signed iOS candidate in internal TestFlight (${{ needs.resolve.outputs.workflow_id }})
    permissions:
      contents: write
    needs: [resolve, validate, ios]
    if: github.repository == 'omnisolo-llc/omniterm-release' && github.ref == 'refs/heads/main' && !inputs.build_only && inputs.ios_action != 'skip'
    environment: app-store
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
